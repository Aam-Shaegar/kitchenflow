name: KitchenFlow CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kitchenflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kitchenflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.7.2
      - run: bash scripts/test-integration.sh
        env:
          KITCHENFLOW_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/kitchenflow_test?sslmode=disable
      - run: make e2e
