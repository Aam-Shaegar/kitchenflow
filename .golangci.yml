version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nakedret
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable: [gofmt]
