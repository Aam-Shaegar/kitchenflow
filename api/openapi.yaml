openapi: 3.0.3
info:
  title: KitchenFlow API
  version: 1.0.0
  description: |
    Kitchen API for the KitchenFlow food delivery backend. Money is in minor units (kopecks, integer).
    Catalog reads and health checks are public. Cart and order routes require a user credential.
    Restaurant management and incoming orders require a scoped partner or admin credential.
    Only admins create restaurants. Callbacks require a restaurant-specific HMAC signature.
    JSON requests accept a single object without unknown or null fields. The limit is 1 MiB, or 64 KiB for callbacks.
servers:
  - url: http://localhost:8080

tags:
  - name: Restaurants
  - name: Menu
  - name: Cart
  - name: Orders
  - name: Restaurant Integration
  - name: Restaurant Portal

paths:
  /api/v1/health:
    get:
      summary: Readiness check (compatibility alias)
      responses:
        '200': { $ref: '#/components/responses/Ready' }
        '503': { $ref: '#/components/responses/NotReady' }

  /api/v1/health/live:
    get:
      summary: Process liveness independent of the database
      responses:
        '200':
          description: HTTP process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [alive] }

  /api/v1/health/ready:
    get:
      summary: Database and schema readiness
      responses:
        '200': { $ref: '#/components/responses/Ready' }
        '503': { $ref: '#/components/responses/NotReady' }

  /api/v1/restaurants:
    get:
      tags: [Restaurants]
      summary: List restaurants
      parameters:
        - name: open
          in: query
          schema: { type: boolean }
          description: If true, return only open restaurants
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Restaurant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RestaurantListItem' }
    post:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Onboard a restaurant (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRestaurantRequest' }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '413': { description: 'Request body exceeds the limit' }
        '201':
          description: Created restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/restaurants/{restaurant_id}:
    get:
      tags: [Restaurants]
      summary: Get restaurant
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
      responses:
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Update restaurant (open/close, contacts)
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRestaurantRequest' }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '413': { description: 'Request body exceeds the limit' }
        '200':
          description: Updated restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/restaurants/{restaurant_id}/menu:
    get:
      tags: [Menu]
      summary: Get restaurant menu
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
        - name: available
          in: query
          schema: { type: boolean }
          description: If true, return only available items
      responses:
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Menu grouped by category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/restaurants/{restaurant_id}/menu/categories:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Create menu category
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, pattern: '\S', maxLength: 120 }
                position: { type: integer, minimum: 0 }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '413': { description: 'Request body exceeds the limit' }
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuCategory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/restaurants/{restaurant_id}/menu/items:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Create menu item (price in kopecks)
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMenuItemRequest' }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '413': { description: 'Request body exceeds the limit' }
        '201':
          description: Created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/restaurants/{restaurant_id}/orders:
    get:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: List incoming orders for a restaurant
      description: Ordered by created_at descending, then id descending. Each page is a consistent database snapshot.
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Restaurant orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /api/v1/menu-items/{menu_item_id}:
    get:
      tags: [Menu]
      summary: Get menu item
      parameters:
        - $ref: '#/components/parameters/MenuItemID'
      responses:
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Menu item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Update menu item (price in kopecks)
      parameters:
        - $ref: '#/components/parameters/MenuItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMenuItemRequest' }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '413': { description: 'Request body exceeds the limit' }
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      security: [{ BearerAuth: [] }]
      tags: [Restaurant Portal]
      summary: Delete menu item
      parameters:
        - $ref: '#/components/parameters/MenuItemID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/cart:
    get:
      security: [{ BearerAuth: [] }]
      tags: [Cart]
      summary: Get current user's cart (single active cart)
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      security: [{ BearerAuth: [] }]
      tags: [Cart]
      summary: Clear cart
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '204': { description: Cleared }

  /api/v1/cart/items:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Cart]
      summary: Add item to cart (one restaurant per cart)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '413': { description: 'Request body exceeds the limit' }
        '404': { description: 'Referenced resource or customer order not found' }
        '201':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/cart/items/{cart_item_id}:
    patch:
      security: [{ BearerAuth: [] }]
      tags: [Cart]
      summary: Change cart item quantity
      parameters:
        - name: cart_item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '413': { description: 'Request body exceeds the limit' }
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      security: [{ BearerAuth: [] }]
      tags: [Cart]
      summary: Remove cart item
      parameters:
        - name: cart_item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Create order from current cart
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '413': { description: 'Request body exceeds the limit' }
        '404': { description: 'Referenced resource or customer order not found' }
        '201':
          description: Saved order, including idempotent replay. Inspect status for restaurant rejection or integration_failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Restaurant integration is missing or not approved by the operator }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: List user's orders
      description: Ordered by created_at descending, then id descending. Each page is a consistent database snapshot.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /api/v1/orders/{order_id}:
    get:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Get order
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order_id}/status:
    get:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Get order status
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Current order status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: '#/components/schemas/OrderStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order_id}/history:
    get:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Get order status history
      description: Ordered by created_at ascending, then history id ascending.
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '404': { description: 'Referenced resource or customer order not found' }
        '200':
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderStatusHistory' }

  /api/v1/orders/{order_id}/cancel:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Cancel order with restaurant confirmation (pending/confirmed only)
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '503': { description: Cancellation not confirmed; retry to reconcile with the restaurant }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order_id}/retry:
    post:
      security: [{ BearerAuth: [] }]
      tags: [Orders]
      summary: Retry restaurant integration for integration_failed orders
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '401': { description: 'Missing, invalid or expired credential' }
        '403': { description: 'Role or restaurant scope does not permit this operation' }
        '400': { description: 'Invalid request or path parameter' }
        '404': { description: 'Referenced resource or customer order not found' }
        '200':
          description: Order after retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Restaurant integration is missing or not approved by the operator }

  /api/v1/integrations/restaurants/{restaurant_id}/orders/status:
    post:
      tags: [Restaurant Integration]
      security: [{ CallbackSignature: [] }]
      description: HMAC-SHA256 signature required. See the README section on signed restaurant callbacks. Keys are restaurant-scoped, expire, and support overlapping rotation.
      summary: Restaurant callback for order status (idempotent via event_id)
      parameters:
        - $ref: '#/components/parameters/RestaurantID'
        - { name: X-Callback-Key-ID, in: header, required: true, schema: { type: string } }
        - { name: X-Callback-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantOrderStatusCallback'
      responses:
        '400': { description: 'Invalid request or path parameter' }
        '401': { description: 'Missing, invalid, expired or wrong-restaurant signature' }
        '413': { description: Callback body exceeds 64 KiB }
        '204': { description: Status accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    CallbackSignature:
      type: apiKey
      in: header
      name: X-Callback-Signature
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    RestaurantID:
      name: restaurant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MenuItemID:
      name: menu_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      description: Invalid or out-of-range values use 20.
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      description: Invalid or negative values use zero.
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Ready:
      description: Database and required schema are ready
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: ['ready'] }
    NotReady:
      description: Database or schema unavailable, or shutdown in progress
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: ['not ready'] }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Business conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    RestaurantListItem:
      type: object
      required: [id, name, description, is_open]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        is_open: { type: boolean }

    Restaurant:
      type: object
      required: [id, external_id, name, description, is_open, integration_base_url, created_at, updated_at]
      properties:
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        description: { type: string }
        is_open: { type: boolean }
        integration_base_url: { type: string }

    CreateRestaurantRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        external_id: { type: string, maxLength: 128 }
        integration_base_url: { type: string, maxLength: 512, description: "HTTP(S) base URL; dispatch requires operator-approved origin and network. Empty disables integration (checkout/retry returns 503)." }

    UpdateRestaurantRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        is_open: { type: boolean }
        integration_base_url: { type: string, maxLength: 512, description: "HTTP(S) base URL; dispatch requires operator-approved origin and network. Empty disables integration (checkout/retry returns 503)." }

    MenuItem:
      type: object
      required: [id, restaurant_id, category_id, external_id, name, description, price, is_available, created_at, updated_at]
      properties:
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        restaurant_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0, description: "Price in minor units (kopecks)" }
        is_available: { type: boolean }

    CreateMenuItemRequest:
      type: object
      additionalProperties: false
      required: [category_id, name, price]
      properties:
        category_id: { type: string, format: uuid }
        external_id: { type: string, maxLength: 128 }
        name: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: integer, minimum: 0, maximum: 1000000000, description: "Price in minor units (kopecks)" }

    UpdateMenuItemRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: integer, minimum: 0, maximum: 1000000000 }
        is_available: { type: boolean }
        category_id: { type: string, format: uuid }

    MenuCategory:
      type: object
      required: [id, restaurant_id, name, position, created_at, updated_at, items]
      properties:
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        position: { type: integer }
        restaurant_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        name: { type: string }
        items:
          nullable: true
          type: array
          items: { $ref: '#/components/schemas/MenuItem' }

    Menu:
      type: object
      required: [restaurant_id, categories]
      properties:
        restaurant_id: { type: string, format: uuid }
        categories:
          type: array
          items: { $ref: '#/components/schemas/MenuCategory' }

    CartItem:
      type: object
      required: [id, cart_id, menu_item_id, name, unit_price, quantity, total_price, created_at, updated_at]
      properties:
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        cart_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        menu_item_id: { type: string, format: uuid }
        name: { type: string }
        unit_price: { type: integer, description: "Minor units (kopecks)" }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        total_price: { type: integer, description: "Minor units (kopecks)" }

    Cart:
      type: object
      required: [id, user_id, restaurant_id, items, total_amount, created_at, updated_at]
      properties:
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        user_id: { type: string }
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        items:
          nullable: true
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total_amount: { type: integer, description: "Minor units (kopecks)" }

    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [restaurant_id, menu_item_id, quantity]
      properties:
        restaurant_id: { type: string, format: uuid }
        menu_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 50 }

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [delivery_address]
      properties:
        delivery_address: { type: string, minLength: 5, maxLength: 500, description: "The service also limits the address to 500 UTF-8 bytes and requires five bytes after trimming whitespace." }

    OrderStatus:
      type: string
      enum: [pending, confirmed, preparing, ready, delivering, delivered, cancelled, integration_failed]

    OrderItem:
      type: object
      required: [id, order_id, menu_item_id, name, unit_price, quantity, total_price, created_at]
      properties:
        created_at: { type: string, format: date-time }
        order_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        external_menu_item_id: { type: string, description: "Immutable partner product ID; omitted for legacy orders. Retry requires all IDs to be reconciled." }
        menu_item_id: { type: string, format: uuid }
        name: { type: string }
        unit_price: { type: integer, description: "Snapshot in kopecks" }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        total_price: { type: integer, description: "Minor units (kopecks)" }

    Order:
      type: object
      required: [id, user_id, restaurant_id, status, total_amount, delivery_address, idempotency_key, items, status_history, created_at, updated_at]
      properties:
        updated_at: { type: string, format: date-time }
        idempotency_key: { type: string }
        user_id: { type: string }
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        external_order_id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { type: integer, description: "Minor units (kopecks)" }
        delivery_address: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        status_history:
          type: array
          items: { $ref: '#/components/schemas/OrderStatusHistory' }
        created_at: { type: string, format: date-time }

    OrderStatusHistory:
      type: object
      required: [id, order_id, status, source, created_at]
      properties:
        order_id: { type: string, format: uuid }
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        source: { type: string, enum: [kitchen, restaurant] }
        event_id: { type: string }
        created_at: { type: string, format: date-time }

    RestaurantOrderStatusCallback:
      type: object
      additionalProperties: false
      required: [external_order_id, status, event_id]
      properties:
        external_order_id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        event_id: { type: string }

    Error:
      type: object
      required: [message, error]
      properties:
        message: { type: string }
        error: { type: string }
